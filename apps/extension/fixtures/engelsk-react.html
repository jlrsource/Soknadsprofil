<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test form – React (English)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Apply: Frontend Engineer</h1>
  <p>Controlled React inputs (like Greenhouse/Lever/Workday). The JSON below shows React state. It should update when the extension fills the form.</p>
  <div id="root"></div>
  <script>
    const e = React.createElement;
    function App() {
      const [s, set] = React.useState({ firstName: "", lastName: "", email: "", phone: "", linkedin: "", company: "", summary: "" });
      const field = (key, label, extra = {}) => [
        e("label", { htmlFor: key, key: key + "l" }, label),
        e(extra.textarea ? "textarea" : "input", { id: key, key, value: s[key], onChange: (ev) => set({ ...s, [key]: ev.target.value }), ...extra.props }),
      ];
      return e("form", { onSubmit: (ev) => ev.preventDefault() },
        ...field("firstName", "First name"),
        ...field("lastName", "Last name"),
        ...field("email", "Email", { props: { type: "email" } }),
        ...field("phone", "Phone", { props: { type: "tel" } }),
        ...field("linkedin", "LinkedIn Profile"),
        ...field("company", "Current company"),
        ...field("summary", "Tell us about yourself", { textarea: true }),
        e("pre", null, JSON.stringify(s, null, 2)));
    }
    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
